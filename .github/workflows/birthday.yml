name: Birthday Bot

on:
  schedule:
    - cron: '30 20 26 9 *'
  workflow_dispatch:

jobs:
  birthday:
    runs-on: ubuntu-latest
    steps:
      - name: Send birthday message
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: |
          python -c "
          import os
          import urllib.parse
          import urllib.request

          token = os.environ['BOT_TOKEN']
          chat_id = os.environ['CHAT_ID']

          message = '''تولدتتتتتتتتتتتتتتتت 🎂✨🤍
روز شکفته شدنتتتتتت 🌸✨🤍
روز ظهور فرشته خداااا 👸🏻✨🤍
مبارک باشه عمرمممم 🤍'''

          data = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': message
          }).encode()

          urllib.request.urlopen(
              f'https://api.telegram.org/bot{token}/sendMessage',
              data=data
          )

          print('Birthday message sent!')
          "
